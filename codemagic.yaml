workflows:
  cng-meter-android:
    name: CNG Meter Android
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Create Android project files
        script: |
          flutter create --platforms=android --org com.cngmeter --project-name cng_meter .
          rm -rf test
      - name: Use CNG Meter main.dart
        script: |
          if [ -f main.dart ]; then
            mkdir -p lib
            cp main.dart lib/main.dart
          fi
          head -n 8 lib/main.dart
      - name: Add permissions to manifest
        script: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '''    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
          '''
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('android:label="cng_meter"', 'android:label="CNG Buddy"')
          open(p, 'w').write(s)
          EOF
      - name: Get packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
